{% load static %}
<header class="header header-page">
  <div class="header-fixed">
    <nav class="navbar navbar-expand-lg header-nav scroll-sticky">
      <div class="container">
        <div class="navbar-header">
          <a id="mobile_btn" href="javascript:void(0);">
            <span class="bar-icon">
              <span></span>
              <span></span>
              <span></span>
            </span>
          </a>
          <a href="{% url 'home' %}" class="navbar-brand logo">
            <img src="{% static 'assets/img/logo-alt.png' %}" class="img-fluid" alt="Logo">
          </a>
        </div>
        <div class="main-menu-wrapper">
          <div class="menu-header">
            <a href="{% url 'home' %}" class="menu-logo">
              <img src="{% static 'assets/img/logo-alt.png' %}" class="img-fluid" alt="Logo">
            </a>
            <a id="menu_close" class="menu-close" href="javascript:void(0);">
              <i class="fas fa-times"></i>
            </a>
          </div>
          <ul class="main-nav">
            <li><a class href="{% url 'news' %}"> News </a></li>
            <li><a class href="{% url 'dashboard' %}"> Shorts </a></li>
            <li><a class href="{% url 'about' %}"> About Us </a></li>
            <li><a class href="{% url 'contact' %}"> Contact Us </a></li>
            {% comment %} <div class="auth-links main-nav">
                {% if user.is_authenticated %}
                <li><a class href="{% url 'dashboard' %}">Dashboard</a></li>
                <li><a class href="{% url 'logout' %}">Logout</a></li>
                {% else %}
                <li><a class href="{% url 'login' %}">Login</a></li>
                {% endif %}
            </div> {% endcomment %}
            <li><a class="auth-links" href="{% url 'logout' %}">Logout</a></li>
          </ul>
        </div>
        <ul class="nav header-navbar-rht">
          <li class="nav-item">
            <div>
              <a href="javascript:void(0);" id="dark-mode-toggle" class="dark-mode-toggle  ">
                <i class="fa-solid fa-moon"></i>
              </a>
              <a href="javascript:void(0);" id="light-mode-toggle" class="dark-mode-toggle ">
                <i class="fa-solid fa-sun"></i>
              </a>
            </div>
          </li>
          <li class="nav-item">
            {{ user.email }}
          </li>
          <li class="nav-item">
            <a class="nav-link header-login" href="{% url 'logout' %}">Logout</a>
          </li>
        </ul>
      </div>
    </nav>
  </div>
</header>
